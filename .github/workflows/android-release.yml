name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Product version to publish
        required: true
        default: "0.1.9"
        type: string
      release:
        description: 12-digit release identifier in yymmddhhMMss format
        required: true
        type: string
      build_number:
        description: Monotonically increasing Android versionCode
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: fridgeboard-android-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FRIDGEBOARD_ANDROID_KEYSTORE_BASE64: ${{ secrets.FRIDGEBOARD_ANDROID_KEYSTORE_BASE64 }}
      FRIDGEBOARD_ANDROID_KEY_ALIAS: ${{ secrets.FRIDGEBOARD_ANDROID_KEY_ALIAS }}
      FRIDGEBOARD_ANDROID_KEY_PASSWORD: ${{ secrets.FRIDGEBOARD_ANDROID_KEY_PASSWORD }}
      FRIDGEBOARD_ANDROID_STORE_PASSWORD: ${{ secrets.FRIDGEBOARD_ANDROID_STORE_PASSWORD }}
      REQUESTED_VERSION: ${{ inputs.version }}
      REQUESTED_RELEASE: ${{ inputs.release }}
      REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$REQUESTED_VERSION"
            release="$REQUESTED_RELEASE"
            build_number="$REQUESTED_BUILD_NUMBER"
          else
            version="${GITHUB_REF_NAME#v}"
            release="$(git show -s --format=%cd --date=format:%y%m%d%H%M%S "$GITHUB_SHA")"
            build_number=$((1700000000 + GITHUB_RUN_NUMBER))
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          package_version="$(node -p "require('./frontend/package.json').version")"
          [[ "$version" == "$package_version" ]]
          [[ "$release" =~ ^[0-9]{12}$ ]]
          [[ "$build_number" =~ ^[1-9][0-9]*$ ]]
          (( build_number <= 2100000000 ))
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            [[ "v$version" == "$GITHUB_REF_NAME" ]]
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$version" >> "$GITHUB_OUTPUT"

      - name: Generate changelog summary
        run: |
          cp "docs/releases/v${{ steps.metadata.outputs.version }}.md" "$RUNNER_TEMP/fridgeboard-release-notes.md"

      - name: Build and verify signed APK
        env:
          FRIDGEBOARD_APP_VERSION: ${{ steps.metadata.outputs.version }}
          FRIDGEBOARD_APP_RELEASE: ${{ steps.metadata.outputs.release }}
          FRIDGEBOARD_BUILD_NUMBER: ${{ steps.metadata.outputs.build_number }}
        run: |
          scripts/mobile-release.sh build \
            --platform android \
            --version "$FRIDGEBOARD_APP_VERSION" \
            --release "$FRIDGEBOARD_APP_RELEASE" \
            --build-number "$FRIDGEBOARD_BUILD_NUMBER"

      - name: Upload APK artifact for workflow retention
        uses: actions/upload-artifact@v4
        with:
          name: fridgeboard-${{ steps.metadata.outputs.version }}-android
          path: output/mobile-release/FridgeBoard-${{ steps.metadata.outputs.version }}-android-${{ steps.metadata.outputs.build_number }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove previous APK assets for same-version republish
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        with:
          github-token: ${{ github.token }}
          script: |
            const tag = `v${process.env.RELEASE_VERSION}`
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            })
            const assetPrefix = `FridgeBoard-${process.env.RELEASE_VERSION}-android-`
            for (const asset of release.assets) {
              const assetSuffix = asset.name.slice(assetPrefix.length)
              if (asset.name.startsWith(assetPrefix) && /^\d+\.apk$/.test(assetSuffix)) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                })
                core.info(`Deleted previous APK asset ${asset.name}`)
              }
            }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag_name }}
          name: FridgeBoard ${{ steps.metadata.outputs.version }} · release ${{ steps.metadata.outputs.release }}
          body_path: ${{ runner.temp }}/fridgeboard-release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: output/mobile-release/FridgeBoard-${{ steps.metadata.outputs.version }}-android-${{ steps.metadata.outputs.build_number }}.apk
          token: ${{ github.token }}

      - name: Verify published APK digest
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const tag = `${{ steps.metadata.outputs.tag_name }}`
            const assetName = `FridgeBoard-${{ steps.metadata.outputs.version }}-android-${{ steps.metadata.outputs.build_number }}.apk`
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            })
            const asset = release.assets.find(candidate => candidate.name === assetName)
            if (!asset || !/^sha256:[0-9a-f]{64}$/i.test(asset.digest || '')) {
              core.setFailed(`GitHub Release asset ${assetName} 缺少有效的 SHA-256 digest`)
            }
