apply plugin: 'com.android.application'

def configuredSigningPropertiesPath = System.getenv('FRIDGEBOARD_ANDROID_KEYSTORE_PROPERTIES')
def repositorySigningPropertiesFile = rootProject.file('keystore.properties')
def protectedSigningPropertiesFile = new File(System.getProperty('user.home'), 'secure/fridgeboard-keystore.properties')
def signingPropertiesFile = configuredSigningPropertiesPath
        ? file(configuredSigningPropertiesPath)
        : repositorySigningPropertiesFile.exists() ? repositorySigningPropertiesFile : protectedSigningPropertiesFile
if (!signingPropertiesFile.exists()) {
    throw new GradleException(
            "未找到 Android 正式签名配置。请将 keystore.properties 放在 Android 工程目录，"
                    + "或设置 FRIDGEBOARD_ANDROID_KEYSTORE_PROPERTIES。不会回退到 Debug 证书。"
    )
}
def signingProperties = new Properties()
signingPropertiesFile.withInputStream { signingProperties.load(it) }
def requiredSigningProperties = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def missingSigningProperties = requiredSigningProperties.findAll { !signingProperties.getProperty(it) }
if (!missingSigningProperties.isEmpty()) {
    throw new GradleException("Android 正式签名配置缺少字段：${missingSigningProperties.join(', ')}")
}
def packageMetadata = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
def releaseVersionCode = (System.getenv('FRIDGEBOARD_ANDROID_VERSION_CODE') ?: '1').toInteger()
def releaseVersionName = System.getenv('FRIDGEBOARD_APP_VERSION') ?: packageMetadata.version

android {
    namespace = "com.fridgeboard.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.fridgeboard.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseVersionCode
        versionName releaseVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            storeFile file(signingProperties.getProperty('storeFile'))
            storePassword signingProperties.getProperty('storePassword')
            keyAlias signingProperties.getProperty('keyAlias')
            keyPassword signingProperties.getProperty('keyPassword')
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.browser:browser:$androidxBrowserVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.work:work-runtime:$androidxWorkVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
