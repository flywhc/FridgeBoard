<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F7F1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-ice3.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16-ice3.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-ice3.png" />
    <link rel="apple-touch-startup-image" href="/splash-1024-ice4.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="家常食橱" />
    <script>
      (() => {
        let theme = 'skeuomorphic'
        try {
          const storedTheme = window.localStorage.getItem('fridgeboard-theme-v1')
          if (storedTheme === 'ink' || storedTheme === 'skeuomorphic' || storedTheme === 'cartoon') theme = storedTheme
        } catch {}
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'skeuomorphic' ? '#F6F7F1' : theme === 'cartoon' ? '#EAF5F1' : '#FFFFFF')
      })()
    </script>
    <style>
      html, body { background: #f6f7f1; }
      .app-boot { width: 100%; height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 14px; color: #765B48; font: 700 18px Arial, "Helvetica Neue", sans-serif; }
      .app-boot img { width: 128px; height: 128px; display: block; object-fit: contain; }
    </style>
    <title>FridgeBoard</title>
  </head>
  <body>
    <div id="root"><div class="app-boot" aria-hidden="true"><img src="/app-boot-ice4.png" alt="" /><span>家常食橱</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
