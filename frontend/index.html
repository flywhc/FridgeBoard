<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#EBE6DD" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-ice3.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16-ice3.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-ice3.png" />
    <link rel="apple-touch-startup-image" href="/splash-1024-ice4.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="家常食橱" />
    <script>
      (() => {
        let theme = 'skeuomorphic'
        try {
          const storedTheme = window.localStorage.getItem('fridgeboard-theme-v1')
          if (storedTheme === 'ink' || storedTheme === 'skeuomorphic' || storedTheme === 'cartoon') theme = storedTheme
        } catch {}
        const themeColor = theme === 'skeuomorphic' ? '#EBE6DD' : theme === 'cartoon' ? '#EAF5F1' : '#FFFFFF'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.setProperty('--initial-theme-color', themeColor)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', themeColor)
      })()
      // Vite 本地开发不能被旧 PWA Service Worker 接管，否则可能缓存过期的 JS 模块并显示白屏。
      if (location.hostname === '127.0.0.1' || location.hostname === 'localhost') {
        void navigator.serviceWorker?.getRegistrations().then(registrations => Promise.all(registrations.map(registration => registration.unregister())))
        void window.caches?.keys().then(keys => Promise.all(keys.filter(key => key.startsWith('fridgeboard-app-')).map(key => window.caches.delete(key))))
      }
    </script>
    <style>
      html, body { background: var(--initial-theme-color, #EBE6DD); }
      .app-boot { width: 100%; height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 14px; color: #765B48; font: 700 18px Arial, "Helvetica Neue", sans-serif; }
      .app-boot img { width: 128px; height: 128px; display: block; object-fit: contain; }
      .app-boot-status { min-height: 22px; font-size: 15px; font-weight: 400; }
    </style>
    <title>FridgeBoard</title>
  </head>
  <body>
    <div id="root"><div class="app-boot"><img src="/app-boot-ice4.png" alt="" /><span>家常食橱</span><span id="app-boot-status" class="app-boot-status" role="status" aria-live="polite" hidden></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
