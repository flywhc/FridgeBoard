<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon-mask.svg" color="#111111" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="家常食橱" />
    <script>
      (() => {
        try {
          const theme = window.localStorage.getItem('fridgeboard-theme-v1')
          if (theme === 'ink' || theme === 'skeuomorphic' || theme === 'cartoon') {
            document.documentElement.dataset.theme = theme
            document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'skeuomorphic' ? '#F4F7F6' : theme === 'cartoon' ? '#EAF5F1' : '#FFFFFF')
          }
        } catch {}
      })()
    </script>
    <style>
      html, body { background: #ffffff; }
      .app-boot { width: 100%; height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 14px; color: #111; font: 700 18px Arial, "Helvetica Neue", sans-serif; }
      .app-boot img { width: 72px; height: 72px; display: block; }
    </style>
    <title>FridgeBoard</title>
  </head>
  <body>
    <div id="root"><div class="app-boot" aria-hidden="true"><img src="/icon-192.png" alt="" /><span>家常食橱</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
