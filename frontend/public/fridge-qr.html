<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="cleartype" content="on">
  <title>家常食橱</title>
  <style>
    *, *:before, *:after { box-sizing: border-box; margin: 0; padding: 0; -webkit-animation: none !important; animation: none !important; -webkit-transition: none !important; transition: none !important; }
    html { width: 100%; min-height: 100%; }
    body { width: 100%; min-height: 100%; background: #fff; color: #27251f; font-family: Arial, Helvetica, sans-serif; font-size: 22px; }
    #page-wrapper { width: 100%; min-height: 100%; }
    .page { width: 100%; }
    .content { width: 100%; padding: 8px 8px 0; }
    .card { width: 100%; margin: 0; background: #fff; border: 0; padding: 18px 8px; text-align: center; }
    h1 { margin: 0 0 18px; font-size: 36px; font-weight: normal; }
    .rule { width: 100%; height: 2px; background: #27251f; margin: 0 0 26px; }
    .lead { margin: 0 0 20px; line-height: 1.5; }
    .qr-frame { width: 82%; margin: 0 auto 18px; padding: 8px; border: 2px solid #27251f; background: #fff; }
    #qr { display: block; width: 100%; height: auto; }
    .status { min-height: 32px; margin: 0; line-height: 1.5; }
    .hint { margin: 20px 0 0; font-size: 18px; line-height: 1.5; }
    .error { color: #7a1f1f; }
    .ok { color: #244b2b; }
    noscript { display: block; margin-top: 18px; border: 2px solid #7a1f1f; padding: 12px; }
  </style>
</head>
<body>
  <div id="page-wrapper">
    <main class="page">
      <section class="content">
        <div class="card">
          <h1 id="page-title">家常食橱</h1>
          <div class="rule"></div>
      <p id="page-lead" class="lead">请用手机相机扫描二维码<br>打开页面后绑定这台冰箱</p>
      <div id="qr-frame" class="qr-frame">
        <img id="qr" alt="首次绑定二维码">
      </div>
      <p id="status" class="status">正在准备二维码……</p>
      <p class="hint">二维码十分钟内有效。扫码完成后，本页会自动更新。</p>
      <noscript>此页面需要开启 JavaScript 才能生成绑定二维码。</noscript>
        </div>
      </section>
    </main>
  </div>
  <script type="text/javascript">
    (function () {
      var statusNode = document.getElementById('status');
      var qrNode = document.getElementById('qr');
      var qrFrame = document.getElementById('qr-frame');
      var titleNode = document.getElementById('page-title');
      var leadNode = document.getElementById('page-lead');
      var hintNode = document.querySelector ? document.querySelector('.hint') : null;
      var currentToken = '';
      var pollTimer = 0;
      var countdownTimer = 0;
      var expiresAt = 0;
      var refreshSession = null;

      function fitQrToViewport() {
        var viewportWidth = document.documentElement.clientWidth || document.body.clientWidth || 758;
        var viewportHeight = document.documentElement.clientHeight || document.body.clientHeight || 899;
        var qrSize = Math.floor(viewportWidth * 0.82) - 20;
        var heightLimit = viewportHeight - 300;
        if (heightLimit < 160) {
          heightLimit = 160;
        }
        if (qrSize > heightLimit) {
          qrSize = heightLimit;
        }
        if (qrSize < 160) {
          qrSize = 160;
        }
        qrNode.style.width = qrSize + 'px';
        qrNode.style.height = qrSize + 'px';
        qrFrame.style.width = (qrSize + 20) + 'px';
        qrFrame.style.height = (qrSize + 20) + 'px';
      }

      function showStatus(message, className) {
        statusNode.className = 'status' + (className ? ' ' + className : '');
        statusNode.innerHTML = message;
      }

      function updateCountdown() {
        var remaining;
        var minutes;
        var seconds;
        if (!hintNode || !expiresAt) {
          return;
        }
        remaining = Math.max(0, Math.ceil((expiresAt - new Date().getTime()) / 1000));
        minutes = Math.floor(remaining / 60);
        seconds = remaining % 60;
        hintNode.innerHTML = '二维码将在 ' + minutes + ':' + (seconds < 10 ? '0' : '') + seconds + ' 后更新。';
        if (remaining === 0) {
          if (countdownTimer) {
            window.clearTimeout(countdownTimer);
            countdownTimer = 0;
          }
          if (refreshSession) {
            refreshSession();
          }
          return;
        }
        countdownTimer = window.setTimeout(updateCountdown, 1000);
      }

      function startCountdown(expiresInSeconds, onExpired) {
        if (countdownTimer) {
          window.clearTimeout(countdownTimer);
          countdownTimer = 0;
        }
        refreshSession = onExpired;
        expiresAt = new Date().getTime() + (expiresInSeconds * 1000);
        updateCountdown();
      }

      function clearTimers() {
        if (pollTimer) {
          window.clearTimeout(pollTimer);
          pollTimer = 0;
        }
        if (countdownTimer) {
          window.clearTimeout(countdownTimer);
          countdownTimer = 0;
        }
      }

      function showRevokedState() {
        clearTimers();
        qrNode.style.display = 'none';
        showStatus('此冰箱端访问已移除。请在手机端重新绑定。', 'error');
        if (hintNode) {
          hintNode.innerHTML = '重新绑定后，再回到此页面。';
        }
      }

      function request(method, path, body, callback) {
        var xhr = new XMLHttpRequest();
        xhr.open(method, path, true);
        xhr.setRequestHeader('Accept', 'application/json');
        if (body !== null) {
          xhr.setRequestHeader('Content-Type', 'application/json');
        }
        xhr.onreadystatechange = function () {
          if (xhr.readyState !== 4) {
            return;
          }
          callback(xhr.status, xhr.responseText || '');
        };
        xhr.onerror = function () {
          callback(0, '');
        };
        try {
          xhr.send(body);
        } catch (error) {
          callback(0, '');
        }
      }

      function parseJson(text) {
        try {
          return JSON.parse(text);
        } catch (error) {
          return null;
        }
      }

      function pollBinding() {
        request('GET', '/api/kindle/first-boot-sessions/current', null, function (status, text) {
          var result;
          if (status === 200) {
            result = parseJson(text);
            if (result && result.state === 'bound') {
              clearTimers();
              showStatus('绑定完成，正在打开冰箱首页。', 'ok');
              qrNode.style.display = 'none';
              if (hintNode) {
                hintNode.innerHTML = '请稍候……';
              }
              window.location.replace('/fridge/device');
              return;
            }
            showStatus('等待手机完成绑定……');
          } else if (status === 404 || status === 400) {
            showStatus('二维码已失效，正在重新生成……', 'error');
            createSession();
            return;
          } else {
            showStatus('正在等待绑定……');
          }
          pollTimer = window.setTimeout(pollBinding, 4000);
        });
      }

      function createSession() {
        clearTimers();
        showStatus('正在准备二维码……');
        request('POST', '/api/kindle/first-boot-sessions', '', function (status, text) {
          var result = parseJson(text);
          if (status < 200 || status >= 300 || !result || !result.pairing_token) {
            showStatus('二维码暂时无法生成，请刷新页面重试。', 'error');
            return;
          }
          currentToken = result.pairing_token;
          qrNode.style.display = 'block';
          qrNode.src = '/api/kindle/first-boot-sessions/qr?token=' + encodeURIComponent(currentToken) + '&t=' + new Date().getTime();
          showStatus('请用手机相机扫描二维码。');
          startCountdown(result.expires_in_seconds || 600, createSession);
          pollTimer = window.setTimeout(pollBinding, 4000);
        });
      }

      function startPage() {
        request('GET', '/api/kindle/page-state', null, function (status, text) {
          var result = parseJson(text);
          if (status === 200 && result && result.state === 'configured') {
            window.location.replace('/fridge/device');
            return;
          }
          if (status === 200 && result && result.state === 'revoked') {
            showRevokedState();
            return;
          }
          if (status === 200 && result && result.state === 'unconfigured') {
            createSession();
            return;
          }
          showStatus('无法确认设备状态，请刷新页面重试。', 'error');
          if (hintNode) {
            hintNode.innerHTML = '请检查网络连接后重试。';
          }
        });
      }

      fitQrToViewport();
      window.onresize = fitQrToViewport;
      startPage();
    }());
  </script>
</body>
</html>
