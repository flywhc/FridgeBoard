services:
  fridgeboard:
    build: .
    container_name: fridgeboard-app
    restart: unless-stopped
    environment:
      FRIDGEBOARD_DATABASE_URL: ${FRIDGEBOARD_DATABASE_URL:-sqlite:////data/fridgeboard.db}
      FRIDGEBOARD_PUBLIC_BASE_URL: ${FRIDGEBOARD_PUBLIC_BASE_URL}
      FRIDGEBOARD_FLYCN_AUTHORIZE_URL: ${FRIDGEBOARD_FLYCN_AUTHORIZE_URL}
      FRIDGEBOARD_FLYCN_EXCHANGE_URL: ${FRIDGEBOARD_FLYCN_EXCHANGE_URL}
      FRIDGEBOARD_FLYCN_CLIENT_SECRET: ${FRIDGEBOARD_FLYCN_CLIENT_SECRET}
      FRIDGEBOARD_LOCAL_OWNER_USER_ID: ${FRIDGEBOARD_LOCAL_OWNER_USER_ID:-}
      FRIDGEBOARD_AGNES_RECOGNITION_URL: ${FRIDGEBOARD_AGNES_RECOGNITION_URL:-https://apihub.agnes-ai.com/v1/chat/completions}
      FRIDGEBOARD_AGNES_API_TOKEN: ${FRIDGEBOARD_AGNES_API_TOKEN:-}
      FRIDGEBOARD_AGNES_MODEL: ${FRIDGEBOARD_AGNES_MODEL:-agnes-2.5-flash}
      FRIDGEBOARD_AGNES_MAX_TOKENS: ${FRIDGEBOARD_AGNES_MAX_TOKENS:-8192}
      FRIDGEBOARD_AGNES_REASONING_EFFORT: ${FRIDGEBOARD_AGNES_REASONING_EFFORT:-none}
      FRIDGEBOARD_AGNES_IMAGE_URL: ${FRIDGEBOARD_AGNES_IMAGE_URL:-https://apihub.agnes-ai.com/v1/images/generations}
      FRIDGEBOARD_AGNES_IMAGE_MODEL: ${FRIDGEBOARD_AGNES_IMAGE_MODEL:-agnes-image-2.1-flash}
      FRIDGEBOARD_LOG_FILE: ${FRIDGEBOARD_LOG_FILE:-/data/logs/fridgeboard.log}
    volumes:
      - fridgeboard-data:/data
    networks:
      - proxy
    mem_limit: 384m
    memswap_limit: 512m
    cpus: 0.75
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fridgeboard-data:

networks:
  proxy:
    external: true
